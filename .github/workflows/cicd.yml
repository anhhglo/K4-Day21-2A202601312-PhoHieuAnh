name: Income model CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/*.dvc"
      - "src/**/*.py"
      - "tests/**/*.py"
      - prepare_data.py
      - append_batch.py
      - params.yaml
      - requirements.txt
      - .github/workflows/cicd.yml

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -v

  train:
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.metrics.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STORAGE_CREDENTIALS }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Pull training data
        run: dvc pull data/train_batch1.csv data/holdout.csv
      - name: Train candidate model
        run: python -m src.train
      - id: metrics
        name: Expose candidate F1
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=${F1}" >> "$GITHUB_OUTPUT"
      - name: Upload candidate model
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: |
            models/model.joblib
            outputs/report.json
          if-no-files-found: error

  quality-gate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Enforce positive-class F1 threshold
        run: |
          python - <<'PY'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65")
          PY

  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download quality-gated candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-model
          path: candidate-model
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STORAGE_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Promote approved model to production
        run: >-
          gcloud storage cp candidate-model/models/model.joblib
          "gs://${{ secrets.ARTIFACT_BUCKET }}/artifacts/current/model.joblib"
      - name: Install the inference service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          install -m 600 /dev/null server_ssh_key
          printf '%s\n' "$SERVER_SSH_KEY" > server_ssh_key
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"
          scp -i server_ssh_key -o StrictHostKeyChecking=yes \
            src/serve.py requirements.txt deploy/income-api.service \
            "$SERVER_USER@$SERVER_HOST:/tmp/"
          ssh -i server_ssh_key -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "SERVER_USER='$SERVER_USER' ARTIFACT_BUCKET='$ARTIFACT_BUCKET' bash -s" <<'REMOTE'
          set -eu
          app_dir="/home/$SERVER_USER/income-api"
          sudo install -d -o "$SERVER_USER" -g "$SERVER_USER" "$app_dir/src"
          sudo install -o "$SERVER_USER" -g "$SERVER_USER" -m 0644 /tmp/serve.py "$app_dir/src/serve.py"
          sudo install -o "$SERVER_USER" -g "$SERVER_USER" -m 0644 /tmp/requirements.txt "$app_dir/requirements.txt"
          sudo -u "$SERVER_USER" python3 -m venv "$app_dir/.venv"
          sudo -u "$SERVER_USER" "$app_dir/.venv/bin/python" -m pip install -r "$app_dir/requirements.txt"
          sed "s|__SERVER_USER__|$SERVER_USER|g" /tmp/income-api.service | sudo tee /etc/systemd/system/income-api.service >/dev/null
          printf 'ARTIFACT_BUCKET=%s\nMODEL_PATH=models/model.joblib\n' "$ARTIFACT_BUCKET" | sudo tee /etc/income-api.env >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable income-api
          sudo systemctl restart income-api
          REMOTE
      - name: Wait for the service health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          for attempt in $(seq 1 60); do
            if ssh -i server_ssh_key -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
              "curl --fail --silent http://127.0.0.1:8080/healthz"; then
              exit 0
            fi
            sleep 1
          done
          echo "income-api did not become healthy within 60 seconds" >&2
          exit 1
